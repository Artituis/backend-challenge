services:
  localstack:
    image: localstack/localstack:4.10.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: dynamic
    ports:
      - '127.0.0.1:${LOCALSTACK_PORT:-4566}:4566'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4566/_localstack/health >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 60
  sqs-init:
    build: .
    environment: &sqs-environment
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_MAX_RECEIVES: ${SQS_MAX_RECEIVES:-5}
      SQS_VISIBILITY_SECONDS: ${SQS_VISIBILITY_SECONDS:-60}
    depends_on:
      localstack:
        condition: service_healthy
    command: ['bun', 'run', 'sqs:provision']
  api:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      <<: *sqs-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering-local}@postgres:5432/${POSTGRES_DB:-wagering}
    ports:
      - '127.0.0.1:${HTTP_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      sqs-init:
        condition: service_completed_successfully
    command: ['bun', 'run', 'start']
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "process.exit((await fetch('http://localhost:3000/health/ready')).ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
  worker:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      <<: *sqs-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering-local}@postgres:5432/${POSTGRES_DB:-wagering}
      CONSUMER_CONCURRENCY: ${CONSUMER_CONCURRENCY:-4}
      OUTBOX_CONCURRENCY: ${OUTBOX_CONCURRENCY:-2}
      PENDING_REFERENCE_TTL_MS: ${PENDING_REFERENCE_TTL_MS:-86400000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      sqs-init:
        condition: service_completed_successfully
    command: ['bun', 'run', 'start:worker']
    expose: ['3001']
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "process.exit((await fetch('http://localhost:3001/health/ready')).ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:17-alpine
    command:
      [
        'postgres',
        '-c',
        'log_statement=none',
        '-c',
        'log_min_error_statement=panic',
        '-c',
        'log_parameter_max_length_on_error=0',
        '-c',
        'log_error_verbosity=terse',
      ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering-local}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering-local}@postgres:5432/${POSTGRES_DB:-wagering}
    depends_on:
      postgres:
        condition: service_healthy
  postgres-test:
    image: postgres:17-alpine
    command:
      [
        'postgres',
        '-c',
        'log_statement=none',
        '-c',
        'log_min_error_statement=panic',
        '-c',
        'log_parameter_max_length_on_error=0',
        '-c',
        'log_error_verbosity=terse',
      ]
    profiles: [test]
    environment:
      POSTGRES_DB: wagering_test
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering-test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering_test']
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    build: .
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgresql://wagering:wagering-test@postgres-test:5432/wagering_test
      TEST_SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres-test:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: ['sh', '-c', 'bun run typecheck && bun test']
volumes:
  postgres_data:
