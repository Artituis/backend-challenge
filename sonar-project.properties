# Organization and project key are supplied by CI repository variables.
# Locally: sonar-scanner -Dsonar.organization=... -Dsonar.projectKey=...
sonar.host.url=https://sonarcloud.io
sonar.projectName=Distributed Wagering Processor
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts
sonar.coverage.exclusions=src/infrastructure/persistence/migrations/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
