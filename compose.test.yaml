# Isolated project, no host ports or production volumes. Managed by scripts/test-environment.ts.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wagering_test
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering-test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wagering -d wagering_test]
      interval: 1s
      timeout: 3s
      retries: 60
  localstack:
    image: localstack/localstack:4.10.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: dynamic
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:4566/_localstack/health >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 60
  runner:
    build: .
    environment:
      TEST_DATABASE_URL: postgresql://wagering:wagering-test@postgres:5432/wagering_test
      TEST_SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOAD_DURATION_SECONDS: ${LOAD_DURATION_SECONDS:-30}
      LOAD_CONCURRENCY: ${LOAD_CONCURRENCY:-20}
      LOAD_WALLETS: ${LOAD_WALLETS:-20}
      LOAD_MAX_REQUESTS: ${LOAD_MAX_REQUESTS:-10000}
      LOAD_DRAIN_SECONDS: ${LOAD_DRAIN_SECONDS:-120}
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: [bun, scripts/integration.ts]
